name: MLflow CI – Heart Disease

on:
  push:
    branches: [main]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ──────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      # ── 3. Install Dependencies ──────────────────────────────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 \
                      pandas==2.2.2 \
                      numpy==1.26.4 \
                      scikit-learn==1.5.1 \
                      matplotlib==3.9.0 \
                      seaborn==0.13.2
          python -c "import mlflow; print('mlflow:', mlflow.__version__)"
          python -c "import sklearn; print('sklearn:', sklearn.__version__)"

      # ── 4. Cek dataset ───────────────────────────────────────────────────────
      - name: Check dataset
        run: |
          echo "=== Isi folder MLProject ==="
          ls -lh MLProject/
          echo "=== Isi folder dataset ==="
          ls -lh MLProject/heart_preprocessing/

      # ── 5. Run modelling.py langsung (tanpa mlflow run) ──────────────────────
      #       Lebih stabil karena tidak bergantung MLProject resolver
      - name: Train Model
        run: |
          cd MLProject
          
          # Set local tracking URI (tidak pakai DagsHub agar tidak error koneksi)
          export MLFLOW_TRACKING_URI="mlruns"
          export MLFLOW_DISABLE_ENV_MANAGER_CONDA_WARNING="TRUE"
          
          python modelling.py \
            --data_path heart_preprocessing/heart_preprocessing.csv \
            --n_estimators 100 \
            --max_depth 10 \
            --min_samples_split 2 \
            --max_features sqrt \
            --test_size 0.2 \
            --random_state 42

          echo "=== Training selesai! ==="
          echo "=== Isi mlruns ==="
          ls -lh mlruns/ 2>/dev/null || echo "mlruns tidak ditemukan"
          ls -lh mlruns/0/ 2>/dev/null || true

      # ── 6. Upload mlruns & artifacts ke GitHub Actions ───────────────────────
      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-run-${{ github.run_number }}
          path: |
            MLProject/mlruns/
            MLProject/artifacts/
          retention-days: 30

      # ── 7. Commit artifacts ke repository ────────────────────────────────────
      - name: Save Artifacts to Repository
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Buat .gitignore untuk mlruns yang besar
          echo "*.pyc" >> .gitignore
          
          # Tambah artifacts saja (lebih kecil dari mlruns)
          git add MLProject/artifacts/ 2>/dev/null || true
          git add .gitignore 2>/dev/null || true
          
          git diff --staged --quiet || \
            git commit -m "ci: update model artifacts - run #${{ github.run_number }} [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 8. Login Docker Hub ───────────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 9. Build & Push Docker Image ─────────────────────────────────────────
      - name: Build and Push Docker Image
        run: |
          # Cari run ID terbaru dari mlruns
          RUN_ID=$(find MLProject/mlruns/0 -mindepth 1 -maxdepth 1 \
                   -type d ! -name 'meta' | sort | tail -1 | xargs basename)
          echo "Run ID: $RUN_ID"

          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest"
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:run${{ github.run_number }}"

          mlflow models build-docker \
            --model-uri "MLProject/mlruns/0/${RUN_ID}/artifacts/model" \
            --name "$IMAGE"

          docker tag "$IMAGE" "$IMAGE_TAG"
          docker push "$IMAGE"
          docker push "$IMAGE_TAG"
          echo "✅ Docker image pushed: $IMAGE"
