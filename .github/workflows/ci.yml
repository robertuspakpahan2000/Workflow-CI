name: MLflow CI – Heart Disease

on:
  push:
    branches: [main]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Miniconda (versi terbaru) ───────────────────────────────────
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          activate-environment: heart-disease-env
          environment-file: MLProject/conda.yaml
          auto-activate-base: false
          conda-remove-defaults: true

      # ── 3. Install MLflow di conda env ───────────────────────────────────────
      - name: Install MLflow
        shell: bash -el {0}
        run: |
          conda activate heart-disease-env
          pip install mlflow==2.19.0
          mlflow --version

      # ── 4. Cek dataset tersedia ───────────────────────────────────────────────
      - name: Check dataset
        run: |
          echo "=== Isi folder MLProject ==="
          ls -lh MLProject/
          echo "=== Isi folder dataset ==="
          ls -lh MLProject/heart_preprocessing/ || echo "Folder dataset tidak ditemukan!"

      # ── 5. Run MLflow Project ────────────────────────────────────────────────
      - name: Run MLflow Project
        shell: bash -el {0}
        env:
          MLFLOW_TRACKING_URI:      ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          conda activate heart-disease-env
          cd MLProject
          mlflow run . \
            --experiment-name "Heart-Disease-CI" \
            --env-manager conda \
            -P n_estimators=100 \
            -P max_depth=10 \
            -P min_samples_split=2

      # ── 6. Upload artifacts ke GitHub ────────────────────────────────────────
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-run-${{ github.run_number }}
          path: |
            MLProject/mlruns/
            MLProject/artifacts/
          retention-days: 30

      # ── 7. Commit artifacts ke repo ──────────────────────────────────────────
      - name: Commit Artifacts to Repo
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MLProject/artifacts/ MLProject/mlruns/ 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "ci: model artifacts - run #${{ github.run_number }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 8. Build & Push Docker Image ─────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image via MLflow
        shell: bash -el {0}
        run: |
          conda activate heart-disease-env
          
          # Cari run_id terbaru
          RUN_ID=$(ls MLProject/mlruns/0/ 2>/dev/null | grep -v meta | tail -1)
          echo "Run ID: $RUN_ID"
          
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest"
          
          mlflow models build-docker \
            --model-uri "MLProject/mlruns/0/${RUN_ID}/artifacts/model" \
            --name "$IMAGE"
          
          docker push "$IMAGE"
          echo "Docker image pushed: $IMAGE"
