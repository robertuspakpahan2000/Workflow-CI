name: MLflow CI - Heart Disease MLProject

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          activate-environment: mlflow-env
          auto-activate-base: false

      - name: Install MLflow
        shell: bash -l {0}
        run: |
          pip install mlflow==2.19.0
          mlflow --version

      - name: Check Dataset
        run: |
          echo "=== MLProject Structure ==="
          ls -lh MLProject/
          echo "=== Dataset ==="
          ls -lh MLProject/heart_preprocessing/

      - name: Run MLflow Project (SESUAI KETENTUAN)
        shell: bash -l {0}
        run: |
          cd MLProject
          
          # Set local tracking (bukan DagsHub untuk CI)
          export MLFLOW_TRACKING_URI="mlruns"
          
          # Jalankan sebagai MLflow Project dengan mlflow run
          # Ini menghasilkan Run ID dan mengelola environment sesuai MLProject spec
          mlflow run . \
            --experiment-name "Heart-Disease-CI" \
            --env-manager local \
            -P n_estimators=100 \
            -P max_depth=10 \
            -P min_samples_split=2 \
            -P max_features=sqrt \
            -P test_size=0.2 \
            -P random_state=42
          
          echo ""
          echo "=== MLflow Project Run Completed Successfully ==="
          echo "=== Generated MLruns ==="
          find mlruns -type d -name "model" | head -5

      - name: Find Model Artifacts
        run: |
          cd MLProject
          
          MODEL_PATH=$(find mlruns -type d -name "model" | head -1)
          echo "Model artifacts location: $MODEL_PATH"
          
          if [ -z "$MODEL_PATH" ]; then
            echo "ERROR: Model artifacts not found!"
            exit 1
          fi
          
          echo "Model found at: $MODEL_PATH"
          ls -lh "$MODEL_PATH"

      - name: Upload MLruns to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-run-${{ github.run_number }}
          path: MLProject/mlruns/
          retention-days: 30

      - name: Commit MLruns to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git add MLProject/mlruns/ 2>/dev/null || true
          git add MLProject/artifacts/ 2>/dev/null || true
          
          git diff --staged --quiet || git commit -m "ci: mlruns artifacts from MLflow Project [skip ci]"
          git push origin main || true
