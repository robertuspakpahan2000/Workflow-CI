name: MLflow CI - Heart Disease

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.1 matplotlib==3.9.0 seaborn==0.13.2
          python -c "import mlflow; print('mlflow:', mlflow.__version__)"

      - name: Check dataset
        run: |
          echo "=== Isi MLProject ==="
          ls -lh MLProject/
          echo "=== Isi dataset ==="
          ls -lh MLProject/heart_preprocessing/

      - name: Train Model
        run: |
          cd MLProject
          export MLFLOW_TRACKING_URI="mlruns"
          export MLFLOW_DISABLE_ENV_MANAGER_CONDA_WARNING="TRUE"
          python modelling.py \
            --data_path heart_preprocessing/heart_preprocessing.csv \
            --n_estimators 100 \
            --max_depth 10 \
            --min_samples_split 2 \
            --max_features sqrt \
            --test_size 0.2 \
            --random_state 42
          echo "=== Struktur mlruns ==="
          find mlruns -type d | head -20

      - name: Find Model Path
        run: |
          cd MLProject
          MODEL_PATH=$(find mlruns -type d -name "model" | head -1)
          echo "Model path: $MODEL_PATH"
          if [ -z "$MODEL_PATH" ]; then
            echo "ERROR: model tidak ditemukan!"
            find mlruns -type f | head -20
            exit 1
          fi
          echo "$MODEL_PATH" > ../model_path.txt

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-run-${{ github.run_number }}
          path: |
            MLProject/mlruns/
            MLProject/artifacts/
          retention-days: 30

      - name: Save Artifacts to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add MLProject/artifacts/ 2>/dev/null || true
          git add MLProject/mlruns/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "ci: artifacts run #${{ github.run_number }} [skip ci]"
          git push origin main

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          MODEL_PATH=$(cat model_path.txt)
          echo "Model path: $MODEL_PATH"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest"
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:run${{ github.run_number }}"
          mlflow models build-docker --model-uri "$MODEL_PATH" --name "$IMAGE"
          docker tag "$IMAGE" "$IMAGE_TAG"
          docker push "$IMAGE"
          docker push "$IMAGE_TAG"
          echo "Docker pushed: $IMAGE"
