name: MLflow CI – Heart Disease

on:
  push:
    branches: [main]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Python Setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      # ── 3. Install Dependencies ──────────────────────────────────────────────
      - name: Install MLflow & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas numpy scikit-learn \
                      matplotlib seaborn dagshub

      # ── 4. Set up Conda (required for mlflow run) ────────────────────────────
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          python-version: '3.12.7'

      # ── 5. Run MLflow Project ────────────────────────────────────────────────
      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_URI:      ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          mlflow run MLProject/ \
            --experiment-name "Heart-Disease-CI" \
            -P n_estimators=100 \
            -P max_depth=10 \
            -P min_samples_split=2

      # ── 6. Upload MLruns as Artifact ─────────────────────────────────────────
      - name: Upload MLruns to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-${{ github.run_number }}
          path: |
            mlruns/
            MLProject/artifacts/
          retention-days: 30

      # ── 7. Commit Artifacts to Repository (GitHub LFS friendly) ─────────────
      - name: Commit MLruns to Repository
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MLProject/artifacts/ || true
          git diff --staged --quiet || \
            git commit -m "ci: update model artifacts - run #${{ github.run_number }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 8. Build Docker Image (mlflow build-docker) ──────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image via MLflow
        env:
          MODEL_URI: "models:/HeartDiseaseCI/latest"
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:${{ github.run_number }}"
          IMAGE_LATEST="${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest"
          
          # Build docker image using mlflow
          mlflow models build-docker \
            --model-uri "runs:/$(ls mlruns/0/ | tail -1)/model" \
            --name "$IMAGE_NAME" \
            --enable-mlserver
          
          # Tag and push
          docker tag "$IMAGE_NAME" "$IMAGE_LATEST"
          docker push "$IMAGE_NAME"
          docker push "$IMAGE_LATEST"
          
          echo "✅ Docker image pushed: $IMAGE_NAME"
